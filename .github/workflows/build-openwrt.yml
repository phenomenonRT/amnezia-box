# Сборка amnezia-box (sing-box + AmneziaWG) под роутеры на OpenWrt.
# Версии берутся из исходников: по умолчанию — последний релиз репозитория-источника;
# можно указать несколько тегов через запятую (например, 1.15.0-alpha.6-awgm.24,1.15.0-alpha.6-awgm.25).
# Тег релиза здесь совпадает с тегом исходников. Если релиз с таким тегом уже есть, версия пропускается.
# Бинарники статические (CGO=0), без зависимостей от libc: работают на OpenWrt 24.10 и 25.x.
# Основной файл amnezia-box-linux-<arch> сжат UPX (-9 --lzma), как в rndnaame/awg-compressed;
# рядом лежит несжатый amnezia-box-linux-<arch>-plain (меньше ОЗУ при запуске).
name: build-openwrt

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Репозиторий с исходниками"
        default: "hoaxisr/amnezia-box"
      source_ref:
        description: "Тег или ветка исходников, можно несколько через запятую (пусто = последний релиз)"
        default: ""
      force:
        description: "Пересобрать, даже если релиз с таким тегом уже есть"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.r.outputs.repo }}
      refs: ${{ steps.r.outputs.refs }}
      latest: ${{ steps.r.outputs.latest }}
      skip: ${{ steps.r.outputs.skip }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          IN_REPO: ${{ inputs.source_repo }}
          IN_REF: ${{ inputs.source_ref }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          REPO="${IN_REPO:-hoaxisr/amnezia-box}"
          LATEST="$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>/dev/null || true)"
          [ -n "$LATEST" ] || LATEST="$(gh api "repos/$REPO/releases?per_page=1" --jq '.[0].tag_name')"
          [ -n "$LATEST" ] && [ "$LATEST" != null ] || { echo "Не удалось определить последний релиз $REPO" >&2; exit 1; }
          LIST="$(printf '%s' "${IN_REF:-}" | tr -d ' ')"
          [ -n "$LIST" ] || LIST="$LATEST"
          TODO=()
          for ref in ${LIST//,/ }; do
            if [ "$FORCE" != true ] && gh release view "$ref" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Пропуск $ref: релиз уже есть"
            else
              TODO+=("$ref")
            fi
          done
          if [ "${#TODO[@]}" -eq 0 ]; then JSON='[]'; SKIP=true; else JSON="$(printf '%s\n' "${TODO[@]}" | jq -R . | jq -sc .)"; SKIP=false; fi
          echo "Источник: $REPO, к сборке: $JSON, последний: $LATEST"
          { echo "repo=$REPO"; echo "refs=$JSON"; echo "latest=$LATEST"; echo "skip=$SKIP"; } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.prepare.outputs.refs) }}
        arch: [mipsel, mips, arm64, armv7, armv5]
        include:
          # arch — суффикс файла; install-openwrt.sh выбирает его по DISTRIB_ARCH
          - { arch: mipsel, goarch: mipsle, gomips: softfloat }  # mipsel_24kc, mipsel_74kc, mipsel_mips32
          - { arch: mips,   goarch: mips,   gomips: softfloat }  # mips_24kc, mips_4kec, mips_mips32
          - { arch: arm64,  goarch: arm64 }                      # aarch64_*
          - { arch: armv7,  goarch: arm,    goarm: "7" }         # arm_cortex-a5/a7/a8/a9/a15
          - { arch: armv5,  goarch: arm,    goarm: "5" }         # arm_arm926ej-s, arm_xscale, arm_mpcore…
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: install-openwrt.sh
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo }}
          ref: ${{ matrix.ref }}
          path: src

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      - name: Build
        working-directory: src
        run: |
          set -euo pipefail
          VERSION="${{ matrix.ref }}"
          TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS),with_awg,with_low_memory"
          echo "Build tags: $TAGS"
          export CGO_ENABLED=0 GOOS=linux GOARCH="${{ matrix.goarch }}"
          [ -n "${{ matrix.gomips }}" ] && export GOMIPS="${{ matrix.gomips }}"
          [ -n "${{ matrix.goarm }}" ]  && export GOARM="${{ matrix.goarm }}"
          mkdir -p ../dist
          OUT="../dist/amnezia-box-linux-${{ matrix.arch }}-plain"
          go build -trimpath -tags "$TAGS" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=$VERSION' $(cat release/LDFLAGS) -s -w -buildid=" \
            -o "$OUT" ./cmd/sing-box
          file "$OUT"; ls -lh "$OUT"

      - name: UPX
        working-directory: dist
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends upx-ucl
          A="amnezia-box-linux-${{ matrix.arch }}"
          cp "$A-plain" "$A"
          if timeout 1200 upx -9 --lzma "$A" && upx -t "$A"; then
            ls -lh "$A-plain" "$A"
          else
            echo "::warning::UPX не справился для ${{ matrix.arch }}, основной файл остаётся несжатым"
            cp "$A-plain" "$A"
          fi

      - name: IPK (для LuCI «Загрузить пакет» и opkg)
        run: |
          set -euo pipefail
          VER="${{ matrix.ref }}"
          A="amnezia-box-linux-${{ matrix.arch }}"
          W="$(mktemp -d)"
          mkdir -p "$W/data/usr/bin" "$W/data/etc/init.d" "$W/data/lib/upgrade/keep.d" "$W/control"
          install -m 0755 "dist/$A" "$W/data/usr/bin/amnezia-box"
          # init-скрипт берём из install-openwrt.sh (одна копия на оба способа установки)
          sed -n "/^cat > \"\$INIT\" <<'EOF'\$/,/^EOF\$/p" install-openwrt.sh | sed '1d;$d' > "$W/data/etc/init.d/amnezia-box"
          [ -s "$W/data/etc/init.d/amnezia-box" ] || { echo "init-скрипт не извлечён" >&2; exit 1; }
          chmod 0755 "$W/data/etc/init.d/amnezia-box"
          echo "/etc/amnezia-box/" > "$W/data/lib/upgrade/keep.d/amnezia-box"
          SIZE="$(du -sb "$W/data" | cut -f1)"
          cat > "$W/control/control" <<CTL
          Package: amnezia-box
          Version: $VER
          Depends: ca-bundle
          Source: ${{ needs.prepare.outputs.repo }}
          SourceName: amnezia-box
          License: GPL-3.0-or-later
          Section: net
          Architecture: all
          Installed-Size: $SIZE
          Description: sing-box with AmneziaWG (static build for OpenWrt routers, ${{ matrix.arch }})
          CTL
          printf '#!/bin/sh\n[ "${IPKG_NO_SCRIPT}" = "1" ] && exit 0\n[ -s ${IPKG_INSTROOT}/lib/functions.sh ] || exit 0\n. ${IPKG_INSTROOT}/lib/functions.sh\ndefault_postinst $0 $@\n' > "$W/control/postinst"
          printf '#!/bin/sh\n[ -s ${IPKG_INSTROOT}/lib/functions.sh ] || exit 0\n. ${IPKG_INSTROOT}/lib/functions.sh\ndefault_prerm $0 $@\n' > "$W/control/prerm"
          chmod 0755 "$W/control/postinst" "$W/control/prerm"
          echo 2.0 > "$W/debian-binary"
          T="--numeric-owner --owner=0 --group=0"
          ( cd "$W/data" && tar $T -czf ../data.tar.gz . )
          ( cd "$W/control" && tar $T -czf ../control.tar.gz . )
          ( cd "$W" && tar $T -czf "$GITHUB_WORKSPACE/dist/amnezia-box_${VER}_${{ matrix.arch }}.ipk" ./debian-binary ./data.tar.gz ./control.tar.gz )
          tar -tzf "dist/amnezia-box_${VER}_${{ matrix.arch }}.ipk"; ls -lh dist/*.ipk

      - name: APK (OpenWrt 25.x)
        continue-on-error: true   # неудача не мешает бинарникам и .ipk попасть в релиз
        run: |
          set -euo pipefail
          VER="${{ matrix.ref }}"
          A="amnezia-box-linux-${{ matrix.arch }}"
          # версия в формате apk: 1.15.0-alpha.10-awgm.31 -> 1.15.0_alpha10_p31
          if [[ "$VER" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-(alpha|beta|rc)\.([0-9]+))?(-awgm\.([0-9]+))?$ ]]; then
            APKV="${BASH_REMATCH[1]}"
            [ -z "${BASH_REMATCH[3]}" ] || APKV="${APKV}_${BASH_REMATCH[3]}${BASH_REMATCH[4]}"
            [ -z "${BASH_REMATCH[6]}" ] || APKV="${APKV}_p${BASH_REMATCH[6]}"
          else
            echo "Версию $VER нельзя записать в формате apk, пропуск" >&2; exit 1
          fi
          W="$(mktemp -d)"
          mkdir -p "$W/files/usr/bin" "$W/files/etc/init.d" "$W/files/lib/upgrade/keep.d"
          install -m 0755 "dist/$A" "$W/files/usr/bin/amnezia-box"
          sed -n "/^cat > \"\$INIT\" <<'EOF'\$/,/^EOF\$/p" install-openwrt.sh | sed '1d;$d' > "$W/files/etc/init.d/amnezia-box"
          [ -s "$W/files/etc/init.d/amnezia-box" ] || { echo "init-скрипт не извлечён" >&2; exit 1; }
          chmod 0755 "$W/files/etc/init.d/amnezia-box"
          echo "/etc/amnezia-box/" > "$W/files/lib/upgrade/keep.d/amnezia-box"
          printf '#!/bin/sh\n[ -n "${IPKG_INSTROOT:-}" ] && exit 0\n/etc/init.d/amnezia-box enable >/dev/null 2>&1\nexit 0\n' > "$W/post-install"
          printf '#!/bin/sh\n[ -n "${IPKG_INSTROOT:-}" ] && exit 0\n/etc/init.d/amnezia-box stop >/dev/null 2>&1\n/etc/init.d/amnezia-box disable >/dev/null 2>&1\nexit 0\n' > "$W/pre-deinstall"
          chmod 0755 "$W/post-install" "$W/pre-deinstall"
          # apk-tools 3 (команда apk mkpkg) берём из alpine:edge
          docker run --rm -v "$W:/w" -e APKV="$APKV" alpine:edge sh -euc '
            apk add --no-cache apk-tools >/dev/null
            apk --version
            apk mkpkg \
              -I name:amnezia-box -I "version:$APKV" -I arch:noarch \
              -I "description:sing-box with AmneziaWG (static build for OpenWrt routers)" \
              -I license:GPL-3.0-or-later -I origin:amnezia-box -I depends:ca-bundle \
              -s post-install:/w/post-install -s pre-deinstall:/w/pre-deinstall \
              -F /w/files -o /w/out.apk
          '
          cp "$W/out.apk" "dist/amnezia-box_${APKV}_${{ matrix.arch }}.apk"
          ls -lh dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: amnezia-box-${{ matrix.ref }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.prepare.outputs.refs) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: amnezia-box-${{ matrix.ref }}-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.ref }}
          SRC: ${{ needs.prepare.outputs.repo }}
          LATEST: ${{ needs.prepare.outputs.latest }}
        run: |
          set -euo pipefail
          NOTES="amnezia-box (sing-box + AWG), статические сборки для роутеров на OpenWrt. Исходники: $SRC@$TAG"
          IS_LATEST=false; [ "$TAG" = "$LATEST" ] && IS_LATEST=true
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$NOTES" --latest="$IS_LATEST" \
            || gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
